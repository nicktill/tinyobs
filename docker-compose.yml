services:
  tinyobs:
    build: .
    ports:
      - "8421:8421"   # UI and API
      - "4318:4318"   # OTLP/HTTP
    environment:
      - TINYOBS_RETENTION=72h
      # - TINYOBS_AUTH_TOKEN=change-me
      # - TINYOBS_SCRAPE=api=host.docker.internal:2112
    volumes:
      - tinyobs-data:/data
    restart: unless-stopped

  # An instrumented example app that sends traffic: docker compose --profile example up
  example:
    build: .
    profiles: ["example"]
    entrypoint: ["tinyobs-example"]
    ports:
      - "3000:3000"
    environment:
      - TINYOBS_ENDPOINT=http://tinyobs:4318
      - TINYOBS_URL=http://tinyobs:8421
    depends_on:
      - tinyobs

volumes:
  tinyobs-data:
